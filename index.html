<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM LuxeBeauty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; color: #1A1A1A; -webkit-tap-highlight-color: transparent; }
        .nav-active { color: #7C3AED; }
        .page { animation: slideUp 0.4s cubic-bezier(0, 0, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Статусы UI */
        .card-completed { opacity: 0.6; filter: grayscale(0.5); border-left: 4px solid #10B981 ! marketplaces; }
        .card-cancelled { opacity: 0.5; border-left: 4px solid #EF4444; }
        .card-waiting { border-left: 4px solid #F59E0B; }
        .card-confirmed { border-left: 4px solid #7C3AED; }
    </style>
</head>
<body class="pb-32">

    <div id="loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-purple-600"></div>
    </div>

    <div id="page-home" class="page p-5">
        <h1 class="text-2xl font-black mb-6">Главная</h1>
        <div class="bg-gradient-to-br from-indigo-600 to-purple-700 rounded-[2.5rem] p-7 text-white shadow-xl mb-8 relative overflow-hidden">
            <div class="relative z-10">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-indigo-100 text-[10px] font-bold uppercase tracking-wider mb-1">Прибыль сегодня</p>
                        <h2 id="today-profit" class="text-4xl font-black">0 ₽</h2>
                    </div>
                    <button onclick="findFreeSlots()" class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-md text-[10px] font-bold uppercase">Окна</button>
                </div>
                <p id="today-rev-sub" class="text-xs text-indigo-100 opacity-90">Загрузка...</p>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
        </div>
        <h3 class="font-bold text-gray-800 mb-4 ml-1 flex items-center gap-2"><i class="fas fa-calendar-day text-purple-500"></i> План на сегодня</h3>
        <div id="home-upcoming" class="space-y-4"></div>
    </div>

    <div id="page-calendar" class="page p-5 hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black">График</h1>
            <button onclick="findFreeSlots()" class="text-purple-600 text-[10px] font-bold bg-purple-50 px-4 py-2 rounded-xl border border-purple-100 uppercase">Поиск окон</button>
        </div>
        <div id="vertical-timeline" class="space-y-8"></div>
    </div>

    <div id="page-clients" class="page p-5 hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black">База</h1>
            <button onclick="openClientModal()" class="w-12 h-12 bg-gray-900 text-white rounded-2xl flex items-center justify-center shadow-lg"><i class="fas fa-plus"></i></button>
        </div>
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-4 text-gray-300 text-sm"></i>
            <input type="text" id="client-search" placeholder="Поиск по имени..." class="w-full bg-white p-4 pl-12 rounded-2xl shadow-sm border border-gray-100 outline-none text-sm">
        </div>
        <div id="clients-list" class="space-y-3"></div>
    </div>

    <div id="page-stats" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">Отчеты</h1>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-50">
                <p class="text-gray-400 text-[9px] font-bold uppercase mb-1 tracking-widest">Чистый доход</p>
                <p id="stat-net-profit" class="text-xl font-black text-green-600">0 ₽</p>
            </div>
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-50">
                <p class="text-gray-400 text-[9px] font-bold uppercase mb-1 tracking-widest">Маржа</p>
                <p id="stat-margin" class="text-xl font-black text-purple-600">0%</p>
            </div>
        </div>
        <div class="bg-white p-7 rounded-[2.5rem] shadow-sm">
            <h4 class="font-bold text-sm mb-5 text-gray-800 uppercase tracking-tighter">Популярные услуги</h4>
            <div id="top-services" class="space-y-4 text-sm font-bold"></div>
        </div>
    </div>

    <div id="modal-appt" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('modal-appt')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-7 max-h-[92vh] overflow-y-auto shadow-2xl">
            <div id="appt-reminders" class="flex gap-2 mb-6 hidden">
                <button onclick="sendRemind('viber')" class="flex-1 bg-purple-600 text-white py-4 rounded-2xl font-bold text-[10px] flex items-center justify-center gap-2 uppercase tracking-wider shadow-lg shadow-purple-200"><i class="fab fa-viber text-sm"></i> Viber</button>
                <button onclick="sendRemind('wa')" class="flex-1 bg-green-500 text-white py-4 rounded-2xl font-bold text-[10px] flex items-center justify-center gap-2 uppercase tracking-wider shadow-lg shadow-green-200"><i class="fab fa-whatsapp text-sm"></i> WhatsApp</button>
            </div>
            <form id="form-appt" class="space-y-4">
                <label class="text-[10px] font-bold text-gray-400 uppercase ml-2 tracking-widest">Статус визита</label>
                <select id="appt-status" class="w-full bg-gray-100 p-4 rounded-2xl font-bold text-sm outline-none border-2 border-transparent focus:border-purple-200 transition-all">
                    <option value="waiting">⏳ Ожидает</option>
                    <option value="confirmed">✅ Подтверждена</option>
                    <option value="completed">🎉 Выполнена</option>
                    <option value="cancelled">❌ Отменена</option>
                </select>
                <select id="appt-client" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold text-sm"></select>
                <select id="appt-service" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold text-sm"></select>
                <div class="flex gap-3">
                    <div class="w-1/2">
                        <label class="text-[9px] font-bold text-gray-400 uppercase ml-2">Цена (₽)</label>
                        <input type="number" id="appt-price" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold">
                    </div>
                    <div class="w-1/2">
                        <label class="text-[9px] font-bold text-gray-400 uppercase ml-2">Расход (₽)</label>
                        <input type="number" id="appt-costs" value="0" class="w-full bg-gray-50 p-4 rounded-2xl font-bold text-red-500">
                    </div>
                </div>
                <div class="flex gap-3">
                    <input type="date" id="appt-date" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold text-sm">
                    <input type="time" id="appt-time" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold text-sm">
                </div>
                <div id="appt-edit-actions" class="hidden text-center pt-4">
                    <button type="button" onclick="handleStatus('deleteAppointment')" class="text-red-500 font-black text-[10px] uppercase tracking-[0.2em] opacity-50 hover:opacity-100 transition-opacity">Удалить запись</button>
                </div>
                <div class="h-12"></div>
            </form>
        </div>
    </div>

    <div id="modal-client" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('modal-client')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-7">
            <h2 class="text-xl font-black mb-6 text-center text-gray-800 uppercase tracking-tighter">Новый клиент</h2>
            <form id="form-client" class="space-y-4">
                <input type="text" id="c-name" placeholder="Имя Фамилия" required class="w-full bg-gray-50 p-5 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-purple-200">
                <input type="tel" id="c-phone" placeholder="Телефон" required class="w-full bg-gray-50 p-5 rounded-2xl font-bold outline-none">
                <input type="text" id="c-inst" placeholder="Instagram / Соцсеть" class="w-full bg-gray-50 p-5 rounded-2xl font-bold outline-none">
                <textarea id="c-notes" placeholder="Заметки о клиенте..." class="w-full bg-gray-50 p-5 rounded-2xl font-medium outline-none h-28"></textarea>
                <div class="h-10"></div>
            </form>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl border-t border-gray-100 flex justify-around py-4 pb-10 z-40">
        <button onclick="switchTab('page-home')" class="nav-btn nav-active flex flex-col items-center gap-1 w-1/4" data-target="page-home">
            <i class="fas fa-home text-xl"></i><span class="text-[9px] font-bold uppercase">Обзор</span>
        </button>
        <button onclick="switchTab('page-calendar')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-calendar">
            <i class="fas fa-calendar-alt text-xl"></i><span class="text-[9px] font-bold uppercase">График</span>
        </button>
        <button onclick="switchTab('page-clients')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-clients">
            <i class="fas fa-user-friends text-xl"></i><span class="text-[9px] font-bold uppercase">База</span>
        </button>
        <button onclick="switchTab('page-stats')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-stats">
            <i class="fas fa-chart-bar text-xl"></i><span class="text-[9px] font-bold uppercase">Отчеты</span>
        </button>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwWCYvfOIP3Ccxg2LMTtJDlI8ClK18Rh6K23h-MVo9Ws0KSXEvBgNhLFQ0Ux6VjjfJqbA/exec";
        const tg = window.Telegram.WebApp;
        let store = { clients: [], appointments: [], services: [] };
        let currentEditId = null;
        let currentClientEditId = null;

        document.addEventListener('DOMContentLoaded', () => { loadData(); tg.expand(); setupPhoneInput(); });

        function setupPhoneInput() {
            const phoneInput = document.getElementById('c-phone');
            phoneInput.addEventListener('focus', () => { if (!phoneInput.value.startsWith('+375')) phoneInput.value = '+375'; });
        }

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}?action=getData`);
                store = await res.json();
                document.getElementById('loader').classList.add('hidden');
                refreshUI();
            } catch (e) { console.error(e); }
        }

        async function sendData(action, payload) {
            tg.MainButton.showProgress();
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) });
            await loadData();
            tg.MainButton.hideProgress();
        }

        function refreshUI() {
            renderDashboard();
            renderCalendar();
            renderClients();
            renderStats();
            populateSelects();
        }

        function formatSheetDate(dateStr) {
            // Исправляем 1899-12-30 и другие ошибки формата
            if (!dateStr || dateStr.includes("1899-12-30")) return new Date().toISOString().split('T')[0];
            return dateStr.split('T')[0];
        }

        function getStatusIcon(status) {
            if (status === 'completed') return '<i class="fas fa-check-circle text-green-500 ml-2"></i>';
            if (status === 'cancelled') return '<i class="fas fa-times-circle text-red-500 ml-2"></i>';
            if (status === 'waiting') return '<i class="fas fa-clock text-amber-500 ml-2"></i>';
            return '<i class="fas fa-calendar-check text-purple-500 ml-2"></i>';
        }

        function renderCalendar() {
            const cont = document.getElementById('vertical-timeline');
            cont.innerHTML = '';
            const today = new Date();
            for (let i = 0; i < 14; i++) {
                const d = new Date(); d.setDate(today.getDate() + i);
                const ds = d.toISOString().split('T')[0];
                const dayAppts = store.appointments.filter(a => formatSheetDate(a.date) === ds).sort((a,b) => a.time.localeCompare(b.time));
                
                cont.innerHTML += `
                    <div>
                        <div class="flex justify-between items-center mb-4 px-1">
                            <span class="font-bold text-gray-400 text-[10px] uppercase tracking-widest">${d.toLocaleDateString('ru',{weekday:'short', day:'numeric', month:'short'})}</span>
                            <button onclick="fastAddAppt('${ds}')" class="text-purple-600 text-[10px] font-black uppercase">+ ЗАПИСЬ</button>
                        </div>
                        <div class="space-y-4">
                            ${dayAppts.map(a => renderAppointmentCard(a)).join('') || '<div class="p-8 border-2 border-dashed border-gray-100 rounded-[2.5rem] text-center text-[10px] text-gray-300 font-bold uppercase tracking-widest">Свободный день</div>'}
                        </div>
                    </div>`;
            }
        }

        function renderAppointmentCard(a) {
            const isCompleted = a.status === 'completed';
            const isCancelled = a.status === 'cancelled';
            return `
                <div onclick="openEditAppt('${a.id}')" class="bg-white p-5 rounded-[1.8rem] shadow-sm border border-gray-50 flex justify-between items-center card-${a.status} transition-all active:scale-[0.98]">
                    <div class="flex items-center gap-4">
                        <div class="text-center bg-gray-50 px-3 py-2 rounded-2xl">
                            <p class="text-[11px] font-black ${isCancelled ? 'line-through text-gray-300' : 'text-purple-600'}">${a.time}</p>
                        </div>
                        <div>
                            <p class="font-bold text-[15px] ${isCancelled ? 'line-through text-gray-300' : (isCompleted ? 'text-gray-500' : 'text-gray-900')} flex items-center">
                                ${a.client_name} ${getStatusIcon(a.status)}
                            </p>
                            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-tighter">${a.service}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-[14px] ${isCancelled ? 'text-gray-200' : 'text-gray-900'}">${a.price} ₽</p>
                        ${a.costs > 0 ? `<p class="text-[9px] text-red-400 font-bold">-${a.costs} ₽</p>` : ''}
                    </div>
                </div>`;
        }

        function renderDashboard() {
            const todayStr = new Date().toISOString().split('T')[0];
            const todayAppts = store.appointments.filter(a => formatSheetDate(a.date) === todayStr);
            
            // Расчет прибыли (только подтвержденные и выполненные)
            const activeAppts = todayAppts.filter(a => a.status !== 'cancelled');
            const rev = activeAppts.reduce((s,a) => s + Number(a.price), 0);
            const costs = activeAppts.reduce((s,a) => s + Number(a.costs || 0), 0);
            
            document.getElementById('today-profit').innerText = (rev - costs).toLocaleString() + ' ₽';
            document.getElementById('today-rev-sub').innerText = `Выручка: ${rev} ₽ | Расходники: ${costs} ₽`;
            
            document.getElementById('home-upcoming').innerHTML = todayAppts.length ? 
                todayAppts.sort((a,b) => a.time.localeCompare(b.time)).map(a => renderAppointmentCard(a)).join('') : 
                '<div class="text-center p-14 bg-white rounded-[3rem] text-gray-300 text-[10px] font-bold uppercase tracking-widest border border-dashed border-gray-100">На сегодня планов нет</div>';
        }

        function renderClients() {
            const term = document.getElementById('client-search').value.toLowerCase();
            const cont = document.getElementById('clients-list');
            cont.innerHTML = store.clients.filter(c => c.name.toLowerCase().includes(term)).map(c => `
                <div onclick="showDetails('${c.id}')" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-50 flex items-center justify-between active:bg-gray-50">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-black text-lg">${c.name[0]}</div>
                        <div><p class="font-black text-sm text-gray-900">${c.name}</p><p class="text-[10px] text-gray-400 font-bold">${c.phone}</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-100 text-xs"></i>
                </div>
            `).join('');
        }

        function openEditAppt(id) {
            const a = store.appointments.find(i => i.id == id);
            currentEditId = id;
            document.getElementById('appt-status').value = a.status || 'confirmed';
            document.getElementById('appt-client').value = a.client_id;
            document.getElementById('appt-service').value = a.service;
            document.getElementById('appt-price').value = a.price;
            document.getElementById('appt-costs').value = a.costs || 0;
            document.getElementById('appt-date').value = formatSheetDate(a.date);
            document.getElementById('appt-time').value = a.time;
            document.getElementById('appt-edit-actions').classList.remove('hidden');
            document.getElementById('appt-reminders').classList.remove('hidden');
            openModal('modal-appt');
        }

        async function handleStatus(act) {
            if(confirm('Вы уверены?')) {
                await sendData(act, {id: currentEditId});
                closeModal('modal-appt');
            }
        }

        function switchTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('nav-active', 'text-gray-300'));
            document.querySelector(`[data-target="${id}"]`).classList.replace('text-gray-300', 'nav-active');
            tg.HapticFeedback.impactOccurred('medium');
        }

        // Остальные функции (populateSelects, sendRemind, stats) остаются без изменений
        function populateSelects() {
            const cS = document.getElementById('appt-client');
            const sS = document.getElementById('appt-service');
            cS.innerHTML = store.clients.map(c => `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`).join('');
            sS.innerHTML = store.services.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            tg.MainButton.setText("СОХРАНИТЬ").show();
            tg.MainButton.offClick();
            tg.MainButton.onClick(() => {
                const form = id === 'modal-appt' ? 'form-appt' : 'form-client';
                document.getElementById(form).requestSubmit();
            });
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); tg.MainButton.hide(); currentEditId = null; }

        document.getElementById('form-appt').onsubmit = async (e) => {
            e.preventDefault();
            const c = document.getElementById('appt-client');
            const data = { 
                id: currentEditId, 
                status: document.getElementById('appt-status').value, 
                client_id: c.value, 
                client_name: c.options[c.selectedIndex].dataset.name, 
                service: document.getElementById('appt-service').value, 
                price: document.getElementById('appt-price').value, 
                costs: document.getElementById('appt-costs').value, 
                date: document.getElementById('appt-date').value, 
                time: document.getElementById('appt-time').value 
            };
            await sendData(currentEditId ? 'updateAppointment' : 'addAppointment', data);
            closeModal('modal-appt');
        };

        function renderStats() {
            const appts = store.appointments.filter(a => a.status === 'completed');
            const rev = appts.reduce((s,a) => s + Number(a.price), 0);
            const costs = appts.reduce((s,a) => s + Number(a.costs || 0), 0);
            document.getElementById('stat-net-profit').innerText = (rev - costs).toLocaleString() + ' ₽';
            document.getElementById('stat-margin').innerText = rev ? Math.round(((rev-costs)/rev)*100) + '%' : '0%';
        }
    </script>
</body>
</html>
