<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business CRM Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F3F4F6; }
        .nav-active { color: #7C3AED; border-top: 2px solid #7C3AED; }
        .time-slot { height: 40px; border-top: 1px solid #E5E7EB; position: relative; }
        .appt-block { position: absolute; left: 60px; right: 10px; border-radius: 8px; padding: 4px 8px; font-size: 10px; font-weight: bold; overflow: hidden; }
        .vip-badge { background: linear-gradient(45deg, #FFD700, #FFA500); color: black; font-size: 8px; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body class="pb-24">

    <div id="page-home" class="page p-4">
        <h1 class="text-xl font-bold mb-4">График на сегодня</h1>
        
        <div class="bg-white rounded-2xl p-4 shadow-sm mb-6">
            <div id="time-grid" class="relative">
                </div>
        </div>
    </div>

    <div id="page-clients" class="page p-4 hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">Клиенты</h1>
            <button onclick="openAddClient()" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-sm font-bold">+ Клиент</button>
        </div>
        <div id="clients-list" class="space-y-3"></div>
    </div>

    <div id="page-expenses" class="page p-4 hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">Расходы</h1>
            <button onclick="openAddExpense()" class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-bold">+ Расход</button>
        </div>
        <div class="bg-white rounded-xl p-4 mb-4 text-center">
            <p class="text-gray-400 text-xs uppercase">Всего за месяц</p>
            <p id="total-expenses-month" class="text-2xl font-black text-red-500">0 ₽</p>
        </div>
        <div id="expenses-list" class="space-y-2"></div>
    </div>

    <div id="page-stats" class="page p-4 hidden">
        <h1 class="text-xl font-bold mb-4">Финансы</h1>
        <div class="grid grid-cols-1 gap-4">
            <div class="bg-gradient-to-r from-green-500 to-emerald-600 p-6 rounded-3xl text-white shadow-lg">
                <p class="text-xs opacity-80 uppercase font-bold">Чистая прибыль (Месяц)</p>
                <h2 id="net-profit" class="text-3xl font-black">0 ₽</h2>
                <p class="text-[10px] mt-2 opacity-70">* Выручка минус расходы на материалы и общие траты</p>
            </div>
        </div>
    </div>

    <div id="modal-quick-client" class="fixed inset-0 z-[60] bg-black/50 hidden flex items-center justify-center p-6">
        <div class="bg-white w-full rounded-3xl p-6">
            <h3 class="font-bold mb-4">Быстрое добавление</h3>
            <input id="q-name" placeholder="Имя" class="w-full bg-gray-100 p-4 rounded-xl mb-2">
            <input id="q-phone" placeholder="Телефон" class="w-full bg-gray-100 p-4 rounded-xl mb-4">
            <button onclick="saveQuickClient()" class="w-full bg-purple-600 text-white py-4 rounded-xl font-bold">Сохранить</button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-white border-t flex justify-around py-3">
        <button onclick="switchTab('page-home')" class="nav-btn nav-active" data-target="page-home"><i class="fas fa-clock"></i><p class="text-[8px]">Обзор</p></button>
        <button onclick="switchTab('page-clients')" class="nav-btn text-gray-400" data-target="page-clients"><i class="fas fa-users"></i><p class="text-[8px]">База</p></button>
        <button onclick="switchTab('page-expenses')" class="nav-btn text-gray-400" data-target="page-expenses"><i class="fas fa-wallet"></i><p class="text-[8px]">Траты</p></button>
        <button onclick="switchTab('page-stats')" class="nav-btn text-gray-400" data-target="page-stats"><i class="fas fa-chart-line"></i><p class="text-[8px]">Финансы</p></button>
    </nav>

    <script>
        let store = { clients: [], appointments: [], expenses: [] };
        const API_URL = "https://script.google.com/macros/s/AKfycbwqL4BpcnwbXb68rdvdoCpLA-LuGPoEuqdm2MEiLjLMOzCpMb9KvVseWM2J6-UkpkpB7g/exec";

        async function loadData() {
            const res = await fetch(API_URL + "?action=getData");
            store = await res.json();
            renderAll();
        }

        function renderAll() {
            renderTimeGrid();
            renderClients();
            renderExpenses();
            renderStats();
        }

        // 1. Рендер шкалы времени
        function renderTimeGrid() {
            const grid = document.getElementById('time-grid');
            grid.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];
            const dayAppts = store.appointments.filter(a => a.date === today && a.status !== 'cancelled');

            for (let h = 8; h <= 21; h++) {
                grid.innerHTML += `
                    <div class="time-slot">
                        <span class="absolute -top-2 left-0 text-[10px] text-gray-400 font-bold">${h}:00</span>
                    </div>
                `;
            }

            dayAppts.forEach(a => {
                const hour = parseInt(a.time.split(':')[0]);
                const min = parseInt(a.time.split(':')[1]);
                const top = (hour - 8) * 40 + (min / 60) * 40;
                grid.innerHTML += `
                    <div class="appt-block bg-purple-100 text-purple-700 border-l-4 border-purple-600 shadow-sm" style="top: ${top}px; height: 38px;">
                        ${a.time} - ${a.client_name}
                    </div>
                `;
            });
        }

        // 2. Клиенты с LTV и VIP статусами
        function renderClients() {
            const list = document.getElementById('clients-list');
            list.innerHTML = store.clients.sort((a,b) => b.ltv - a.ltv).map(c => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm">
                    <div>
                        <div class="flex items-center gap-2">
                            <p class="font-bold">${c.name}</p>
                            <span class="vip-badge">${c.status_label}</span>
                        </div>
                        <p class="text-[10px] text-gray-400">${c.phone}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-black text-purple-600">${c.ltv.toLocaleString()} ₽</p>
                        <p class="text-[8px] text-gray-400 uppercase">Всего покупок</p>
                    </div>
                </div>
            `).join('');
        }

        // 3. Расходы
        function renderExpenses() {
            const list = document.getElementById('expenses-list');
            const currentMonth = new Date().getMonth();
            const monthlyExp = store.expenses.filter(e => new Date(e.date).getMonth() === currentMonth);
            const total = monthlyExp.reduce((s, e) => s + Number(e.amount), 0);
            
            document.getElementById('total-expenses-month').innerText = total.toLocaleString() + ' ₽';
            list.innerHTML = monthlyExp.map(e => `
                <div class="bg-white p-3 rounded-xl flex justify-between text-sm">
                    <span class="text-gray-500">${e.date}</span>
                    <span class="font-bold">${e.category}</span>
                    <span class="text-red-500 font-bold">-${e.amount} ₽</span>
                </div>
            `).join('');
        }

        // 4. Финансы (Чистая прибыль)
        function renderStats() {
            const currentMonth = new Date().getMonth();
            const monthlyAppts = store.appointments.filter(a => a.status === 'completed' && new Date(a.date).getMonth() === currentMonth);
            const rev = monthlyAppts.reduce((s, a) => s + Number(a.price), 0);
            const materialCosts = monthlyAppts.reduce((s, a) => s + Number(a.costs || 0), 0);
            const generalExpenses = store.expenses.filter(e => new Date(e.date).getMonth() === currentMonth).reduce((s, e) => s + Number(e.amount), 0);
            
            const net = rev - materialCosts - generalExpenses;
            document.getElementById('net-profit').innerText = net.toLocaleString() + ' ₽';
        }

        // Функции для быстрой работы
        function switchTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active', 'text-gray-400'));
            // ... логика подсветки
        }

        async function saveQuickClient() {
            const data = { name: document.getElementById('q-name').value, phone: document.getElementById('q-phone').value };
            // Отправка на сервер и обновление списка в селекторе записи
            await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'addClient', ...data})});
            document.getElementById('modal-quick-client').classList.add('hidden');
            loadData();
        }
    </script>
</body>
</html>
