<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM Luxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; color: #111827; -webkit-tap-highlight-color: transparent; }
        .nav-active { color: #7C3AED; }
        .card-completed { opacity: 0.6; background-color: #F9FAFB !important; border-left: 4px solid #10B981 !important; }
        .card-cancelled { opacity: 0.5; background-color: #F9FAFB !important; border-left: 4px solid #EF4444 !important; text-decoration: line-through; }
        .fab { position: fixed; bottom: 100px; right: 20px; width: 60px; h-60px; background: #7C3AED; color: white; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 24px; shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4); z-index: 40; }
        .page { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-32">

    <div id="loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-purple-600"></div>
    </div>

    <div id="fab" class="fab" onclick="fastAddAppt()">
        <i class="fas fa-plus"></i>
    </div>

    <div id="page-home" class="page p-5">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black">Обзор</h1>
            <div class="text-right">
                <p id="current-date" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"></p>
            </div>
        </header>

        <div class="bg-white rounded-[2.5rem] p-6 shadow-sm mb-6 border border-gray-100">
            <p class="text-[10px] font-bold text-gray-400 uppercase mb-1">Прибыль за сегодня</p>
            <h2 id="today-profit" class="text-3xl font-black text-purple-600">0 ₽</h2>
            <div class="mt-4 flex gap-4">
                <div class="flex-1 bg-green-50 p-3 rounded-2xl">
                    <p class="text-[8px] font-bold text-green-600 uppercase">Выручка</p>
                    <p id="today-rev" class="font-bold text-sm">0 ₽</p>
                </div>
                <div class="flex-1 bg-red-50 p-3 rounded-2xl">
                    <p class="text-[8px] font-bold text-red-600 uppercase">Расход</p>
                    <p id="today-cost" class="font-bold text-sm">0 ₽</p>
                </div>
            </div>
        </div>

        <h3 class="font-bold text-gray-800 mb-4 ml-1">План на сегодня</h3>
        <div id="home-upcoming" class="space-y-3"></div>
    </div>

    <div id="page-calendar" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">График</h1>
        <div id="vertical-timeline" class="space-y-6"></div>
    </div>

    <div id="page-clients" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">Клиенты</h1>
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-4 text-gray-300"></i>
            <input type="text" id="client-search" placeholder="Поиск по имени или телефону..." class="w-full bg-white p-4 pl-12 rounded-2xl border-none shadow-sm text-sm outline-none">
        </div>
        <div id="clients-list" class="space-y-3"></div>
    </div>

    <div id="page-stats" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">Аналитика</h1>
        
        <div class="space-y-4">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm">
                <h4 class="text-xs font-bold text-gray-400 uppercase mb-4">Финансы за все время</h4>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-2xl font-black text-purple-600" id="total-revenue">0 ₽</p>
                        <p class="text-[10px] text-gray-400 font-bold uppercase">Оборот</p>
                    </div>
                    <div>
                        <p class="text-2xl font-black text-green-500" id="total-net">0 ₽</p>
                        <p class="text-[10px] text-gray-400 font-bold uppercase">Чистыми</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2rem] shadow-sm">
                <h4 class="text-xs font-bold text-gray-400 uppercase mb-4">Эффективность</h4>
                <div class="flex justify-between items-end h-32 gap-2" id="stats-chart">
                    </div>
                <div class="flex justify-between mt-2 text-[8px] font-bold text-gray-300 uppercase">
                    <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                </div>
            </div>

            <div id="top-services-list" class="bg-white p-6 rounded-[2rem] shadow-sm space-y-3">
                <h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Топ услуг</h4>
            </div>
        </div>
    </div>

    <div id="modal-appt" class="fixed inset-0 z-50 hidden flex items-end">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('modal-appt')"></div>
        <div class="relative w-full bg-white rounded-t-[2.5rem] p-8 max-h-[90vh] overflow-y-auto">
            <div id="appt-reminders" class="flex gap-2 mb-6 hidden">
                <button onclick="sendRemind('viber')" class="flex-1 bg-[#7360F2] text-white py-4 rounded-2xl font-bold text-[10px] uppercase flex items-center justify-center gap-2"><i class="fab fa-viber"></i> Viber</button>
                <button onclick="sendRemind('wa')" class="flex-1 bg-[#25D366] text-white py-4 rounded-2xl font-bold text-[10px] uppercase flex items-center justify-center gap-2"><i class="fab fa-whatsapp"></i> WhatsApp</button>
            </div>
            <form id="form-appt" class="space-y-4">
                <select id="appt-status" class="w-full bg-gray-100 p-4 rounded-2xl font-bold outline-none">
                    <option value="confirmed">✅ Подтверждена</option>
                    <option value="waiting">⏳ Ожидает</option>
                    <option value="completed">✔️ Выполнена</option>
                    <option value="cancelled">❌ Отменена</option>
                </select>
                <select id="appt-client" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none"></select>
                <select id="appt-service" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none"></select>
                <div class="flex gap-2">
                    <input type="number" id="appt-price" placeholder="Цена" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                    <input type="number" id="appt-costs" placeholder="Расход" class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold outline-none text-red-500">
                </div>
                <div class="flex gap-2">
                    <input type="date" id="appt-date" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                    <input type="time" id="appt-time" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                </div>
                <div id="appt-delete-btn" class="hidden text-center pt-2">
                    <button type="button" onclick="handleStatus('deleteAppointment')" class="text-red-400 text-[10px] font-bold uppercase tracking-widest">Удалить запись</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-details" class="fixed inset-0 z-50 hidden flex items-end">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-md" onclick="closeDetails()"></div>
        <div class="relative w-full bg-white rounded-t-[3rem] p-8 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="det-name" class="text-2xl font-black"></h2>
                    <p id="det-phone" class="text-gray-400 font-bold text-sm"></p>
                </div>
                <button onclick="editCurrentClient()" class="bg-gray-100 p-3 rounded-2xl text-purple-600"><i class="fas fa-edit"></i></button>
            </div>
            
            <div class="grid grid-cols-3 gap-3 mb-8">
                <button id="det-viber" class="bg-purple-100 text-purple-600 p-4 rounded-3xl flex flex-col items-center gap-2">
                    <i class="fab fa-viber text-xl"></i><span class="text-[8px] font-black uppercase">Viber</span>
                </button>
                <button id="det-wa" class="bg-green-100 text-green-600 p-4 rounded-3xl flex flex-col items-center gap-2">
                    <i class="fab fa-whatsapp text-xl"></i><span class="text-[8px] font-black uppercase">WA</span>
                </button>
                <button id="det-call" class="bg-gray-100 text-gray-900 p-4 rounded-3xl flex flex-col items-center gap-2">
                    <i class="fas fa-phone text-xl"></i><span class="text-[8px] font-black uppercase">Call</span>
                </button>
            </div>

            <div class="bg-indigo-50 p-5 rounded-[2rem] mb-6">
                <div class="flex justify-between mb-2">
                    <span class="text-[10px] font-bold text-indigo-400 uppercase">Всего визитов</span>
                    <span id="det-count" class="font-black text-indigo-600">0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-[10px] font-bold text-indigo-400 uppercase">Общий чек</span>
                    <span id="det-total" class="font-black text-indigo-600">0 ₽</span>
                </div>
            </div>

            <h4 class="text-xs font-bold text-gray-400 uppercase mb-4 ml-2">История записей</h4>
            <div id="det-history" class="space-y-3 pb-10"></div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-xl border-t border-gray-100 flex justify-around py-5 pb-8 z-40">
        <button onclick="switchTab('page-home')" class="nav-btn nav-active flex flex-col items-center gap-1 w-1/4" data-target="page-home">
            <i class="fas fa-th-large text-xl"></i><span class="text-[9px] font-bold uppercase">Обзор</span>
        </button>
        <button onclick="switchTab('page-calendar')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-calendar">
            <i class="fas fa-calendar-alt text-xl"></i><span class="text-[9px] font-bold uppercase">График</span>
        </button>
        <button onclick="switchTab('page-clients')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-clients">
            <i class="fas fa-user-friends text-xl"></i><span class="text-[9px] font-bold uppercase">База</span>
        </button>
        <button onclick="switchTab('page-stats')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-stats">
            <i class="fas fa-chart-pie text-xl"></i><span class="text-[9px] font-bold uppercase">Отчеты</span>
        </button>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxRiJaXZ3ooLVl71pk_5xHSIeKyXaccaaYrE6sSeVAmP97fWNf0JajACDX5v77sr8_-6g/exec";
        const tg = window.Telegram.WebApp;
        let store = { clients: [], appointments: [], services: [] };
        let currentEditId = null;
        let currentClientEditId = null;

        document.addEventListener('DOMContentLoaded', () => {
            tg.expand();
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('ru', {day:'numeric', month:'long'});
            loadData();
        });

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}?action=getData`);
                store = await res.json();
                document.getElementById('loader').classList.add('hidden');
                refreshUI();
            } catch (e) { console.error(e); }
        }

        function refreshUI() {
            renderDashboard();
            renderCalendar();
            renderClients();
            renderStats();
            populateSelects();
        }

        function populateSelects() {
            const cS = document.getElementById('appt-client');
            const sS = document.getElementById('appt-service');
            cS.innerHTML = store.clients.map(c => `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`).join('');
            sS.innerHTML = store.services.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        }

        function getApptClass(status) {
            if (status === 'completed') return 'card-completed';
            if (status === 'cancelled') return 'card-cancelled';
            return '';
        }

        function renderDashboard() {
            const today = new Date().toISOString().split('T')[0];
            const appts = store.appointments.filter(a => a.date === today);
            
            const rev = appts.filter(a => a.status !== 'cancelled').reduce((s,a) => s + Number(a.price), 0);
            const cost = appts.filter(a => a.status !== 'cancelled').reduce((s,a) => s + Number(a.costs || 0), 0);
            
            document.getElementById('today-profit').innerText = (rev - cost).toLocaleString() + ' ₽';
            document.getElementById('today-rev').innerText = rev.toLocaleString() + ' ₽';
            document.getElementById('today-cost').innerText = cost.toLocaleString() + ' ₽';

            document.getElementById('home-upcoming').innerHTML = appts.sort((a,b)=>a.time.localeCompare(b.time)).map(a => `
                <div onclick="openEditAppt('${a.id}')" class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center border border-gray-50 ${getApptClass(a.status)}">
                    <div class="flex items-center gap-4">
                        <span class="font-black text-purple-600 text-sm">${a.time}</span>
                        <div>
                            <p class="font-bold text-sm text-gray-800">${a.client_name}</p>
                            <p class="text-[9px] text-gray-400 font-bold uppercase">${a.service}</p>
                        </div>
                    </div>
                    <p class="font-black text-sm">${a.price} ₽</p>
                </div>
            `).join('') || '<p class="text-center text-gray-300 text-xs py-10">Нет записей на сегодня</p>';
        }

        function renderCalendar() {
            const cont = document.getElementById('vertical-timeline');
            cont.innerHTML = '';
            const today = new Date();
            for (let i = 0; i < 14; i++) {
                const d = new Date(); d.setDate(today.getDate() + i);
                const ds = d.toISOString().split('T')[0];
                const dayAppts = store.appointments.filter(a => a.date === ds).sort((a,b)=>a.time.localeCompare(b.time));
                
                cont.innerHTML += `
                    <div>
                        <div class="flex justify-between items-center mb-4 px-1">
                            <span class="font-bold text-gray-400 text-[10px] uppercase tracking-widest">${d.toLocaleDateString('ru',{weekday:'short', day:'numeric', month:'short'})}</span>
                        </div>
                        <div class="space-y-3">
                            ${dayAppts.map(a => `
                                <div onclick="openEditAppt('${a.id}')" class="bg-white p-4 rounded-3xl shadow-sm flex justify-between items-center ${getApptClass(a.status)}">
                                    <div class="flex items-center gap-3">
                                        <span class="font-black text-xs text-purple-500">${a.time}</span>
                                        <div>
                                            <p class="font-bold text-sm">${a.client_name}</p>
                                            <p class="text-[8px] text-gray-400 uppercase font-black">${a.service}</p>
                                        </div>
                                    </div>
                                    <p class="font-black text-sm">${a.price} ₽</p>
                                </div>
                            `).join('') || '<div class="p-6 border-2 border-dashed border-gray-200 rounded-[2rem] text-center text-[10px] text-gray-300 font-bold uppercase">Свободно</div>'}
                        </div>
                    </div>`;
            }
        }

        function renderClients() {
            const term = document.getElementById('client-search').value.toLowerCase();
            const cont = document.getElementById('clients-list');
            cont.innerHTML = store.clients.filter(c => c.name.toLowerCase().includes(term) || c.phone.includes(term)).map(c => `
                <div onclick="showDetails('${c.id}')" class="bg-white p-4 rounded-3xl shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center font-black">${c.name[0]}</div>
                        <div><p class="font-bold text-sm">${c.name}</p><p class="text-[10px] text-gray-400 font-bold">${c.phone}</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-200 text-xs"></i>
                </div>
            `).join('');
        }
        document.getElementById('client-search').oninput = renderClients;

        function showDetails(id) {
            const c = store.clients.find(c => c.id == id);
            if(!c) return;
            currentClientEditId = id;
            document.getElementById('det-name').innerText = c.name;
            document.getElementById('det-phone').innerText = c.phone;
            
            const history = store.appointments.filter(a => a.client_id == id).sort((a,b)=>b.date.localeCompare(a.date));
            document.getElementById('det-count').innerText = history.length;
            document.getElementById('det-total').innerText = history.filter(a=>a.status=='completed').reduce((s,a)=>s+Number(a.price),0).toLocaleString() + ' ₽';

            const phone = c.phone.replace(/\D/g, '');
            document.getElementById('det-viber').onclick = () => tg.openLink(`viber://chat?number=${phone}`);
            document.getElementById('det-wa').onclick = () => tg.openLink(`https://wa.me/${phone}`);
            document.getElementById('det-call').onclick = () => tg.openLink(`tel:${c.phone}`);

            document.getElementById('det-history').innerHTML = history.map(a => `
                <div class="bg-gray-50 p-4 rounded-2xl flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-gray-400 uppercase">${a.date}</p>
                        <p class="font-bold text-xs">${a.service}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-xs">${a.price} ₽</p>
                        <p class="text-[8px] font-bold uppercase ${a.status=='completed'?'text-green-500':'text-amber-500'}">${a.status}</p>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-gray-300 text-[10px] uppercase font-bold py-5">История пуста</p>';

            document.getElementById('modal-details').classList.remove('hidden');
        }

        function renderStats() {
            const appts = store.appointments.filter(a => a.status === 'completed');
            const totalRev = appts.reduce((s,a) => s + Number(a.price), 0);
            const totalCost = appts.reduce((s,a) => s + Number(a.costs || 0), 0);
            
            document.getElementById('total-revenue').innerText = totalRev.toLocaleString() + ' ₽';
            document.getElementById('total-net').innerText = (totalRev - totalCost).toLocaleString() + ' ₽';

            const svcs = {};
            appts.forEach(a => svcs[a.service] = (svcs[a.service] || 0) + 1);
            document.getElementById('top-services-list').innerHTML = '<h4 class="text-xs font-bold text-gray-400 uppercase mb-2">Топ услуг</h4>' + 
                Object.entries(svcs).sort((a,b)=>b[1]-a[1]).map(([name, count]) => `
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-bold text-gray-600">${name}</span>
                        <span class="font-black text-purple-600">${count}</span>
                    </div>
                `).join('');

            // Простейший график
            const chart = document.getElementById('stats-chart');
            chart.innerHTML = [30, 50, 80, 40, 90, 60, 20].map(h => `
                <div class="flex-1 bg-purple-100 rounded-t-lg relative" style="height: ${h}%">
                    <div class="absolute inset-x-0 bottom-0 bg-purple-500 rounded-t-lg" style="height: ${h-10}%"></div>
                </div>
            `).join('');
        }

        async function sendRemind(type) {
            const a = store.appointments.find(i => i.id == currentEditId);
            const c = store.clients.find(i => i.id == a.client_id);
            const text = `Привет, ${c.name}! Напоминаю о записи: ${a.date} в ${a.time} (${a.service}). Жду тебя!`;
            const phone = c.phone.replace(/\D/g, '');
            
            await navigator.clipboard.writeText(text);
            tg.HapticFeedback.notificationOccurred('success');
            
            let url = (type === 'viber') 
                ? `viber://chat?number=${phone}&draft=${encodeURIComponent(text)}` 
                : `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
            tg.openLink(url);
        }

        function openEditAppt(id) {
            const a = store.appointments.find(i => i.id == id);
            currentEditId = id;
            document.getElementById('appt-status').value = a.status;
            document.getElementById('appt-client').value = a.client_id;
            document.getElementById('appt-service').value = a.service;
            document.getElementById('appt-price').value = a.price;
            document.getElementById('appt-costs').value = a.costs || 0;
            document.getElementById('appt-date').value = a.date;
            document.getElementById('appt-time').value = a.time;
            document.getElementById('appt-delete-btn').classList.remove('hidden');
            document.getElementById('appt-reminders').classList.remove('hidden');
            openModal('modal-appt');
        }

        function fastAddAppt(ds = new Date().toISOString().split('T')[0]) {
            document.getElementById('form-appt').reset();
            document.getElementById('appt-date').value = ds;
            document.getElementById('appt-delete-btn').classList.add('hidden');
            document.getElementById('appt-reminders').classList.add('hidden');
            openModal('modal-appt');
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            tg.MainButton.setText("СОХРАНИТЬ").show().onClick(async () => {
                const form = id === 'modal-appt' ? 'form-appt' : 'form-client';
                const f = document.getElementById(form);
                if(f.checkValidity()) {
                    const data = id === 'modal-appt' ? {
                        id: currentEditId,
                        status: document.getElementById('appt-status').value,
                        client_id: document.getElementById('appt-client').value,
                        client_name: document.getElementById('appt-client').options[document.getElementById('appt-client').selectedIndex].dataset.name,
                        service: document.getElementById('appt-service').value,
                        price: document.getElementById('appt-price').value,
                        costs: document.getElementById('appt-costs').value,
                        date: document.getElementById('appt-date').value,
                        time: document.getElementById('appt-time').value
                    } : {
                        // Данные клиента если нужно
                    };
                    tg.MainButton.showProgress();
                    await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: currentEditId ? 'updateAppointment' : 'addAppointment', ...data }) });
                    await loadData();
                    closeModal(id);
                } else { tg.showAlert("Заполните поля"); }
            });
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); tg.MainButton.hide(); currentEditId = null; }
        function closeDetails() { document.getElementById('modal-details').classList.add('hidden'); }

        function switchTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('nav-active', 'text-gray-300'));
            document.querySelector(`[data-target="${id}"]`).classList.replace('text-gray-300', 'nav-active');
            tg.HapticFeedback.impactOccurred('light');
        }
        
        async function handleStatus(act) { if(confirm('Удалить?')) { tg.MainButton.showProgress(); await fetch(API_URL, {method:'POST', body: JSON.stringify({action: act, id: currentEditId})}); await loadData(); closeModal('modal-appt'); } }
    </script>
</body>
</html>
