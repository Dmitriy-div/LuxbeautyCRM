<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM Pro Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F9FAFB; color: #111827; -webkit-tap-highlight-color: transparent; }
        .nav-active { color: #7C3AED; }
        .page { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Статусы */
        .card-completed { border-left: 4px solid #10B981; opacity: 0.8; }
        .card-cancelled { border-left: 4px solid #EF4444; opacity: 0.6; filter: grayscale(1); }
        .card-waiting { border-left: 4px solid #F59E0B; }
        .card-confirmed { border-left: 4px solid #7C3AED; }

        /* Круглая кнопка */
        .fab {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 64px;
            height: 64px;
            background: #7C3AED;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
            z-index: 40;
            transition: all 0.2s;
        }
        .fab:active { transform: scale(0.9); box-shadow: 0 5px 10px rgba(124, 58, 237, 0.3); }
    </style>
</head>
<body class="pb-32">

    <div id="loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-purple-600"></div>
    </div>

    <div id="fab-add" class="fab" onclick="fastAddAppt()">
        <i class="fas fa-plus"></i>
    </div>

    <div id="page-home" class="page p-5">
        <h1 class="text-2xl font-black mb-6">Сегодня</h1>
        <div class="bg-gradient-to-br from-purple-600 to-indigo-700 rounded-[2.5rem] p-7 text-white shadow-xl mb-8">
            <p class="text-purple-100 text-[10px] font-bold uppercase tracking-widest mb-1">Чистая прибыль</p>
            <h2 id="today-profit" class="text-4xl font-black mb-4">0 ₽</h2>
            <div class="flex justify-between text-[11px] font-medium text-purple-100 bg-white/10 p-4 rounded-2xl backdrop-blur-sm">
                <span>Выручка: <b id="today-rev" class="text-white text-sm ml-1">0 ₽</b></span>
                <span>Расход: <b id="today-cost" class="text-white text-sm ml-1">0 ₽</b></span>
            </div>
        </div>
        <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i class="far fa-clock text-purple-500"></i> Ближайшие записи</h3>
        <div id="home-upcoming" class="space-y-4"></div>
    </div>

    <div id="page-calendar" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">График</h1>
        <div id="vertical-timeline" class="space-y-8"></div>
    </div>

    <div id="page-clients" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">База клиентов</h1>
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-4 text-gray-300"></i>
            <input type="text" id="client-search" placeholder="Поиск по имени..." class="w-full bg-white p-4 pl-12 rounded-2xl shadow-sm border-none outline-none text-sm">
        </div>
        <div id="clients-list" class="space-y-3"></div>
    </div>

    <div id="page-stats" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">Отчеты</h1>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-5 rounded-3xl shadow-sm">
                <p class="text-gray-400 text-[9px] font-bold uppercase mb-1">Всего доход</p>
                <p id="total-revenue" class="text-xl font-black text-indigo-600">0 ₽</p>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm">
                <p class="text-gray-400 text-[9px] font-bold uppercase mb-1">Маржинальность</p>
                <p id="margin-percent" class="text-xl font-black text-green-500">0%</p>
            </div>
        </div>
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm">
            <h4 class="font-bold text-sm mb-4 text-gray-800 uppercase tracking-widest">Топ услуг</h4>
            <div id="top-services" class="space-y-3"></div>
        </div>
    </div>

    <div id="modal-details" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-md" onclick="closeDetails()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[3rem] p-8 max-h-[85vh] overflow-y-auto">
            <div class="text-center mb-6">
                <div id="det-avatar" class="w-20 h-20 bg-purple-100 text-purple-600 rounded-3xl mx-auto flex items-center justify-center text-3xl font-black mb-3"></div>
                <h2 id="det-name" class="text-2xl font-black text-gray-900"></h2>
                <p id="det-phone" class="text-gray-400 font-medium"></p>
            </div>
            
            <div class="flex gap-3 mb-8">
                <button id="det-viber" class="flex-1 bg-purple-600 text-white p-4 rounded-2xl flex flex-col items-center gap-1 shadow-lg shadow-purple-100"><i class="fab fa-viber text-xl"></i><span class="text-[8px] font-bold uppercase">Viber</span></button>
                <button id="det-wa" class="flex-1 bg-green-500 text-white p-4 rounded-2xl flex flex-col items-center gap-1 shadow-lg shadow-green-100"><i class="fab fa-whatsapp text-xl"></i><span class="text-[8px] font-bold uppercase">WhatsApp</span></button>
                <button id="det-call" class="flex-1 bg-gray-900 text-white p-4 rounded-2xl flex flex-col items-center gap-1 shadow-lg shadow-gray-200"><i class="fas fa-phone-alt text-xl"></i><span class="text-[8px] font-bold uppercase">Позвонить</span></button>
            </div>

            <div class="bg-gray-50 p-5 rounded-[2rem] mb-6 flex justify-around text-center">
                <div><p class="text-[9px] font-bold text-gray-400 uppercase">Визиты</p><p id="det-visits" class="font-black text-lg">0</p></div>
                <div class="w-[1px] h-10 bg-gray-200"></div>
                <div><p class="text-[9px] font-bold text-gray-400 uppercase">Общий чек</p><p id="det-total" class="font-black text-lg text-purple-600">0 ₽</p></div>
            </div>

            <h4 class="font-bold text-xs text-gray-400 uppercase mb-4 ml-2">История посещений</h4>
            <div id="det-history" class="space-y-3 pb-8"></div>
        </div>
    </div>

    <div id="modal-appt" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('modal-appt')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-7 max-h-[92vh] overflow-y-auto">
            <div id="appt-reminders" class="flex gap-2 mb-6 hidden">
                <button onclick="sendRemind('viber')" class="flex-1 bg-purple-600 text-white py-4 rounded-2xl font-bold text-[10px] uppercase flex items-center justify-center gap-2"><i class="fab fa-viber text-sm"></i> Viber</button>
                <button onclick="sendRemind('wa')" class="flex-1 bg-green-500 text-white py-4 rounded-2xl font-bold text-[10px] uppercase flex items-center justify-center gap-2"><i class="fab fa-whatsapp text-sm"></i> WhatsApp</button>
            </div>
            <form id="form-appt" class="space-y-4">
                <select id="appt-status" class="w-full bg-gray-100 p-4 rounded-2xl font-bold text-sm outline-none">
                    <option value="confirmed">✅ Подтверждена</option>
                    <option value="waiting">⏳ Ожидает</option>
                    <option value="completed">🎉 Выполнена</option>
                    <option value="cancelled">❌ Отменена</option>
                </select>
                <select id="appt-client" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold text-sm"></select>
                <select id="appt-service" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold text-sm"></select>
                <div class="flex gap-3">
                    <input type="number" id="appt-price" placeholder="Цена ₽" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold">
                    <input type="number" id="appt-costs" placeholder="Расход ₽" value="0" class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold text-red-500">
                </div>
                <div class="flex gap-3">
                    <input type="date" id="appt-date" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold text-sm">
                    <input type="time" id="appt-time" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold text-sm">
                </div>
                <div id="appt-edit-actions" class="hidden text-center pt-2">
                    <button type="button" onclick="handleStatus('deleteAppointment')" class="text-red-500 font-black text-[10px] uppercase tracking-widest">Удалить запись</button>
                </div>
                <div class="h-10"></div>
            </form>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl border-t border-gray-100 flex justify-around py-4 pb-10 z-40">
        <button onclick="switchTab('page-home')" class="nav-btn nav-active flex flex-col items-center gap-1 w-1/4" data-target="page-home">
            <i class="fas fa-home text-xl"></i><span class="text-[9px] font-bold uppercase">Обзор</span>
        </button>
        <button onclick="switchTab('page-calendar')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-calendar">
            <i class="fas fa-calendar-alt text-xl"></i><span class="text-[9px] font-bold uppercase">График</span>
        </button>
        <button onclick="switchTab('page-clients')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-clients">
            <i class="fas fa-user-friends text-xl"></i><span class="text-[9px] font-bold uppercase">База</span>
        </button>
        <button onclick="switchTab('page-stats')" class="nav-btn text-gray-300 flex flex-col items-center gap-1 w-1/4" data-target="page-stats">
            <i class="fas fa-chart-pie text-xl"></i><span class="text-[9px] font-bold uppercase">Отчеты</span>
        </button>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxRiJaXZ3ooLVl71pk_5xHSIeKyXaccaaYrE6sSeVAmP97fWNf0JajACDX5v77sr8_-6g/exec";
        const tg = window.Telegram.WebApp;
        let store = { clients: [], appointments: [], services: [] };
        let currentEditId = null;

        document.addEventListener('DOMContentLoaded', () => { loadData(); tg.expand(); });

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}?action=getData`);
                store = await res.json();
                document.getElementById('loader').classList.add('hidden');
                refreshUI();
            } catch (e) { console.error(e); }
        }

        function fixDate(d) {
            if (!d || d.includes('1899-12-30')) return new Date().toISOString().split('T')[0];
            return d.split('T')[0];
        }

        function refreshUI() {
            renderDashboard();
            renderCalendar();
            renderClients();
            renderStats();
            populateSelects();
        }

        function renderDashboard() {
            const today = new Date().toISOString().split('T')[0];
            const appts = store.appointments.filter(a => fixDate(a.date) === today);
            
            const confirmed = appts.filter(a => a.status !== 'cancelled');
            const rev = confirmed.reduce((s,a) => s + Number(a.price), 0);
            const cost = confirmed.reduce((s,a) => s + Number(a.costs || 0), 0);
            
            document.getElementById('today-profit').innerText = (rev - cost).toLocaleString() + ' ₽';
            document.getElementById('today-rev').innerText = rev.toLocaleString() + ' ₽';
            document.getElementById('today-cost').innerText = cost.toLocaleString() + ' ₽';

            document.getElementById('home-upcoming').innerHTML = appts.length ? 
                appts.sort((a,b) => a.time.localeCompare(b.time)).map(a => renderCard(a)).join('') : 
                '<p class="text-center text-gray-300 text-xs py-10">Записей на сегодня нет</p>';
        }

        function renderCard(a) {
            const statusClass = `card-${a.status}`;
            return `
                <div onclick="openEditAppt('${a.id}')" class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center ${statusClass}">
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-black text-purple-600">${a.time}</span>
                        <div>
                            <p class="font-bold text-sm">${a.client_name}</p>
                            <p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest">${a.service}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-sm">${a.price} ₽</p>
                    </div>
                </div>`;
        }

        function renderCalendar() {
            const cont = document.getElementById('vertical-timeline');
            cont.innerHTML = '';
            const today = new Date();
            for (let i = 0; i < 14; i++) {
                const d = new Date(); d.setDate(today.getDate() + i);
                const ds = d.toISOString().split('T')[0];
                const dayAppts = store.appointments.filter(a => fixDate(a.date) === ds).sort((a,b) => a.time.localeCompare(b.time));
                
                cont.innerHTML += `
                    <div>
                        <div class="flex justify-between items-center mb-4 px-1">
                            <span class="font-bold text-gray-400 text-[10px] uppercase tracking-[0.2em]">${d.toLocaleDateString('ru',{weekday:'short', day:'numeric', month:'short'})}</span>
                        </div>
                        <div class="space-y-3">
                            ${dayAppts.map(a => renderCard(a)).join('') || '<div class="p-6 border-2 border-dashed border-gray-100 rounded-[2rem] text-center text-[10px] text-gray-300 font-bold uppercase">Окон нет</div>'}
                        </div>
                    </div>`;
            }
        }

        function renderClients() {
            const term = document.getElementById('client-search').value.toLowerCase();
            const cont = document.getElementById('clients-list');
            cont.innerHTML = store.clients.filter(c => c.name.toLowerCase().includes(term)).map(c => `
                <div onclick="showDetails('${c.id}')" class="bg-white p-4 rounded-3xl shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center font-black text-lg">${c.name[0]}</div>
                        <div><p class="font-black text-sm text-gray-900">${c.name}</p><p class="text-[10px] text-gray-400 font-bold">${c.phone}</p></div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-200"></i>
                </div>
            `).join('');
        }
        document.getElementById('client-search').oninput = renderClients;

        function showDetails(id) {
            const c = store.clients.find(i => i.id == id);
            const history = store.appointments.filter(a => a.client_id == id).sort((a,b) => b.date.localeCompare(a.date));
            
            document.getElementById('det-avatar').innerText = c.name[0];
            document.getElementById('det-name').innerText = c.name;
            document.getElementById('det-phone').innerText = c.phone;
            document.getElementById('det-visits').innerText = history.filter(a=>a.status=='completed').length;
            document.getElementById('det-total').innerText = history.filter(a=>a.status=='completed').reduce((s,a)=>s+Number(a.price), 0).toLocaleString() + ' ₽';
            
            const cleanPhone = c.phone.replace(/\D/g, '');
            document.getElementById('det-viber').onclick = () => sendRemind('viber', id);
            document.getElementById('det-wa').onclick = () => sendRemind('wa', id);
            document.getElementById('det-call').onclick = () => window.location.assign('tel:' + c.phone);

            document.getElementById('det-history').innerHTML = history.map(a => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center border border-gray-100">
                    <div>
                        <p class="text-[9px] font-bold text-gray-400 uppercase">${a.date.split('T')[0]}</p>
                        <p class="font-bold text-xs">${a.service}</p>
                    </div>
                    <p class="font-black text-xs ${a.status=='cancelled'?'text-red-400':'text-gray-900'}">${a.price} ₽</p>
                </div>
            `).join('');

            document.getElementById('modal-details').classList.remove('hidden');
        }

        function renderStats() {
            const completed = store.appointments.filter(a => a.status === 'completed');
            const totalRev = completed.reduce((s,a) => s + Number(a.price), 0);
            const totalCost = completed.reduce((s,a) => s + Number(a.costs || 0), 0);
            
            document.getElementById('total-revenue').innerText = totalRev.toLocaleString() + ' ₽';
            document.getElementById('margin-percent').innerText = totalRev ? Math.round(((totalRev-totalCost)/totalRev)*100) + '%' : '0%';
            
            const svcCounts = {};
            completed.forEach(a => svcCounts[a.service] = (svcCounts[a.service] || 0) + 1);
            document.getElementById('top-services').innerHTML = Object.entries(svcCounts).sort((a,b)=>b[1]-a[1]).map(([name, count]) => `
                <div class="flex justify-between items-center text-sm font-bold">
                    <span class="text-gray-600">${name}</span>
                    <span class="text-purple-600">${count} визитов</span>
                </div>
            `).join('');
        }

        async function sendRemind(type, clientId = null) {
            let a, c;
            if (clientId) {
                c = store.clients.find(i => i.id == clientId);
                a = { service: "визит", date: "", time: "" }; // Базовый текст для карточки клиента
            } else {
                a = store.appointments.find(i => i.id == currentEditId);
                c = store.clients.find(i => i.id == a.client_id);
            }

            const phone = c.phone.replace(/\D/g, '');
            const text = `Привет, ${c.name}! Напоминаю о записи: ${fixDate(a.date)} в ${a.time} (${a.service}). Жду тебя!`;
            
            await navigator.clipboard.writeText(text);
            tg.HapticFeedback.notificationOccurred('success');

            if (type === 'viber') {
                window.location.assign(`viber://chat?number=${phone}`);
            } else {
                window.location.assign(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`);
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            tg.MainButton.setText("СОХРАНИТЬ").show().onClick(() => {
                const form = id === 'modal-appt' ? 'form-appt' : 'form-client';
                document.getElementById(form).requestSubmit();
            });
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); tg.MainButton.hide(); currentEditId = null; }
        function closeDetails() { document.getElementById('modal-details').classList.add('hidden'); }

        function fastAddAppt() {
            document.getElementById('form-appt').reset();
            document.getElementById('appt-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('appt-edit-actions').classList.add('hidden');
            document.getElementById('appt-reminders').classList.add('hidden');
            openModal('modal-appt');
        }

        function openEditAppt(id) {
            const a = store.appointments.find(i => i.id == id);
            currentEditId = id;
            document.getElementById('appt-status').value = a.status;
            document.getElementById('appt-client').value = a.client_id;
            document.getElementById('appt-service').value = a.service;
            document.getElementById('appt-price').value = a.price;
            document.getElementById('appt-costs').value = a.costs || 0;
            document.getElementById('appt-date').value = fixDate(a.date);
            document.getElementById('appt-time').value = a.time;
            document.getElementById('appt-edit-actions').classList.remove('hidden');
            document.getElementById('appt-reminders').classList.remove('hidden');
            openModal('modal-appt');
        }

        document.getElementById('form-appt').onsubmit = async (e) => {
            e.preventDefault();
            const sel = document.getElementById('appt-client');
            const data = {
                id: currentEditId,
                status: document.getElementById('appt-status').value,
                client_id: sel.value,
                client_name: sel.options[sel.selectedIndex].dataset.name,
                service: document.getElementById('appt-service').value,
                price: document.getElementById('appt-price').value,
                costs: document.getElementById('appt-costs').value,
                date: document.getElementById('appt-date').value,
                time: document.getElementById('appt-time').value
            };
            tg.MainButton.showProgress();
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: currentEditId ? 'updateAppointment' : 'addAppointment', ...data }) });
            await loadData();
            closeModal('modal-appt');
        };

        function switchTab(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('nav-active', 'text-gray-300'));
            document.querySelector(`[data-target="${id}"]`).classList.replace('text-gray-300', 'nav-active');
            tg.HapticFeedback.impactOccurred('light');
        }

        function populateSelects() {
            const cS = document.getElementById('appt-client');
            const sS = document.getElementById('appt-service');
            cS.innerHTML = store.clients.map(c => `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`).join('');
            sS.innerHTML = store.services.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        }
        
        async function handleStatus(act) { if(confirm('Удалить?')) { tg.MainButton.showProgress(); await fetch(API_URL, {method:'POST', body: JSON.stringify({action: act, id: currentEditId})}); await loadData(); closeModal('modal-appt'); } }
    </script>
</body>
</html>
