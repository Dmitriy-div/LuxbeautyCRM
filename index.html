<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LuxeCRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FB; color: #111827; -webkit-tap-highlight-color: transparent; }
        
        /* Сетка времени */
        .time-grid-container { background: white; border-radius: 24px; border: 1px solid #F1F1F4; position: relative; overflow: hidden; }
        .time-row { height: 64px; border-top: 1px solid #F8F9FB; position: relative; }
        .time-label { position: absolute; left: 12px; top: -10px; font-size: 10px; font-weight: 700; color: #9CA3AF; background: white; padding: 0 4px; z-index: 5; }
        
        .appt-slot { 
            position: absolute; left: 56px; right: 12px; 
            background: #F5F3FF; border-left: 4px solid #7C3AED; 
            border-radius: 12px; padding: 8px 12px; z-index: 10;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.08);
        }

        /* FAB */
        .fab { position: fixed; bottom: 100px; right: 20px; width: 64px; height: 64px; background: #7C3AED; color: white; border-radius: 32px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 12px 24px rgba(124, 58, 237, 0.3); z-index: 50; transition: 0.2s; }
        .fab:active { transform: scale(0.9); }
        
        .nav-btn { color: #9CA3AF; font-weight: 700; transition: 0.2s; }
        .nav-active { color: #7C3AED; }

        /* Статусы */
        .card-completed { border-left: 4px solid #10B981 !important; }
        .card-cancelled { border-left: 4px solid #EF4444 !important; opacity: 0.6; }
        .status-waiting { border-left: 4px solid #F59E0B; }
        .status-confirmed { border-left: 4px solid #7C3AED; }

        .vip-badge { background: linear-gradient(135deg, #FFD700, #FFA500); color: white; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-weight: 800; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <div id="loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600"></div>
    </div>

    <div id="main-fab" class="fab" onclick="handleFabClick()"><i class="fas fa-plus"></i></div>

    <div id="page-appointments" class="page p-5">
        <h1 class="text-2xl font-black mb-6">Записи</h1>
        <div class="bg-indigo-600 rounded-[2.5rem] p-7 text-white shadow-xl mb-8">
            <p class="text-indigo-100 text-[10px] font-bold uppercase tracking-widest mb-1">Выручка сегодня</p>
            <h2 id="today-profit" class="text-4xl font-black">0 ₽</h2>
        </div>

        <div class="time-grid-container mb-8">
            <div id="time-grid-content" class="relative"></div>
        </div>

        <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Список на сегодня</h3>
        <div id="home-upcoming" class="space-y-3"></div>
    </div>

    <div id="page-clients" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">Клиенты</h1>
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-4 top-4 text-gray-400"></i>
            <input type="text" id="client-search" oninput="renderClients()" placeholder="Поиск..." class="w-full bg-white p-4 pl-12 rounded-2xl border border-gray-100 outline-none shadow-sm">
        </div>
        <button onclick="toggleSleeping()" id="btn-sleeping" class="mb-6 px-4 py-2 bg-white border border-gray-200 rounded-xl text-[10px] font-bold text-gray-500 uppercase">💤 Спящие (>45 дн)</button>
        <div id="clients-list" class="space-y-3"></div>
    </div>

    <div id="page-waitlist" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">Очередь</h1>
        <div id="waitlist-list" class="space-y-3"></div>
    </div>

    <div id="page-budget" class="page p-5 hidden">
        <h1 class="text-2xl font-black mb-6">Бюджет</h1>
        <div class="bg-white p-8 rounded-[2.5rem] border border-gray-100 shadow-sm text-center mb-8">
            <p class="text-gray-400 text-[10px] font-bold uppercase mb-2">Чистая прибыль (Месяц)</p>
            <h2 id="stat-net-profit" class="text-4xl font-black text-gray-900">0 ₽</h2>
        </div>
        <div id="expenses-list" class="space-y-2"></div>
    </div>

    <div id="modal-appt" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('modal-appt')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-7 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-black">Запись</h2></div>
            <form id="form-appt" class="space-y-4">
                <select id="appt-status" class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none border-none">
                    <option value="waiting">⏳ Ожидает</option>
                    <option value="confirmed">✅ Подтверждена</option>
                    <option value="completed">🎉 Выполнена</option>
                    <option value="cancelled">❌ Отменена</option>
                </select>
                <div class="flex gap-2">
                    <select id="appt-client" required class="flex-1 bg-gray-50 p-4 rounded-2xl font-bold outline-none"></select>
                    <button type="button" onclick="openQuickClient()" class="w-14 bg-purple-100 text-purple-600 rounded-2xl font-black text-xl">+</button>
                </div>
                <select id="appt-service" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none"></select>
                <input type="number" id="appt-price" placeholder="Цена ₽" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                <div class="flex gap-3">
                    <input type="date" id="appt-date" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                    <input type="time" id="appt-time" required class="w-1/2 bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                </div>
                <div id="appt-actions" class="hidden grid grid-cols-2 gap-3 pt-4">
                    <button type="button" onclick="copyReminderText()" class="bg-purple-600 text-white p-4 rounded-2xl font-bold text-xs">УВЕДОМЛЕНИЕ</button>
                    <button type="button" onclick="deleteAppt()" class="bg-red-50 text-red-500 p-4 rounded-2xl font-bold text-xs">УДАЛИТЬ</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-client" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('modal-client')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-7">
            <h2 class="text-xl font-black mb-6">Клиент</h2>
            <form id="form-client" class="space-y-4">
                <input type="text" id="c-name" placeholder="Имя" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                <input type="tel" id="c-phone" placeholder="Телефон" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                <textarea id="c-notes" placeholder="Заметки..." class="w-full bg-gray-50 p-4 rounded-2xl font-medium outline-none h-32"></textarea>
            </form>
        </div>
    </div>

    <div id="modal-details" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-md" onclick="closeDetails()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[3rem] p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-8">
                <div><h2 id="det-name" class="text-3xl font-black text-gray-900"></h2><p id="det-phone" class="text-gray-400 font-bold"></p></div>
                <button onclick="editClient()" class="bg-gray-100 w-12 h-12 rounded-2xl flex items-center justify-center text-gray-600"><i class="fas fa-pen"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button id="det-call" class="bg-gray-900 text-white p-5 rounded-[1.5rem] font-bold flex items-center justify-center gap-3"><i class="fas fa-phone-alt"></i> Позвонить</button>
                <div class="bg-purple-50 p-5 rounded-[1.5rem] text-center"><p class="text-[10px] font-bold text-purple-400 uppercase">LTV</p><p id="det-total" class="text-xl font-black text-purple-600"></p></div>
            </div>
            <div class="bg-amber-50 p-6 rounded-[2rem] border border-amber-100 mb-8">
                <p class="text-[10px] font-black text-amber-600 uppercase mb-2">Заметки / Формулы</p>
                <p id="det-notes-view" class="text-sm text-amber-900 font-medium italic whitespace-pre-wrap"></p>
            </div>
            <h4 class="text-xs font-black text-gray-400 uppercase mb-4 tracking-widest">История визитов</h4>
            <div id="det-history" class="space-y-3 pb-10"></div>
        </div>
    </div>

    <div id="modal-expense" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('modal-expense')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-7"><h2 class="text-xl font-black mb-6">Расход</h2>
            <form id="form-expense" class="space-y-4">
                <input type="date" id="e-date" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                <input type="text" id="e-category" placeholder="Категория" class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                <input type="number" id="e-amount" placeholder="Сумма ₽" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
            </form>
        </div>
    </div>

    <div id="modal-waitlist" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeModal('modal-waitlist')"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-7"><h2 class="text-xl font-black mb-6">Очередь</h2>
            <form id="form-waitlist" class="space-y-4">
                <input type="text" id="w-name" placeholder="Имя" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                <input type="tel" id="w-phone" placeholder="Телефон" required class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
                <input type="text" id="w-date" placeholder="Желаемая дата" class="w-full bg-gray-50 p-4 rounded-2xl font-bold outline-none">
            </form>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 flex justify-around py-4 pb-8 z-40">
        <button onclick="switchTab('page-appointments')" class="nav-btn nav-active flex flex-col items-center w-1/4" data-target="page-appointments"><i class="fas fa-calendar-alt text-xl mb-1"></i><span class="text-[10px] font-black uppercase">Записи</span></button>
        <button onclick="switchTab('page-clients')" class="nav-btn flex flex-col items-center w-1/4" data-target="page-clients"><i class="fas fa-users text-xl mb-1"></i><span class="text-[10px] font-black uppercase">Клиенты</span></button>
        <button onclick="switchTab('page-waitlist')" class="nav-btn flex flex-col items-center w-1/4" data-target="page-waitlist"><i class="fas fa-hourglass-half text-xl mb-1"></i><span class="text-[10px] font-black uppercase">Очередь</span></button>
        <button onclick="switchTab('page-budget')" class="nav-btn flex flex-col items-center w-1/4" data-target="page-budget"><i class="fas fa-wallet text-xl mb-1"></i><span class="text-[10px] font-black uppercase">Бюджет</span></button>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzxdJrc18Vk0IezwitYtSfNpheesZ8BXH6eXJS71C9nlnzg-D-2cZGMbBTx8z1HfjgVLg/exec";
        const tg = window.Telegram.WebApp;
        let store = { clients: [], appointments: [], expenses: [], waitlist: [], services: [] };
        let currentTab = 'page-appointments';
        let editId = null;
        let isQuickClient = false;

        // --- УНИВЕРСАЛЬНЫЙ КОНВЕРТЕР ДАТЫ ---
        function fmtDate(d) {
            if (!d) return '--.--';
            const date = new Date(d);
            if (isNaN(date)) return d; // Если это уже строка yyyy-mm-dd
            return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        document.addEventListener('DOMContentLoaded', () => { tg.expand(); loadData(); });

        async function loadData() {
            document.getElementById('loader').classList.remove('hidden');
            const res = await fetch(`${API_URL}?action=getData`);
            store = await res.json();
            document.getElementById('loader').classList.add('hidden');
            refreshUI();
        }

        function refreshUI() {
            renderTimeGrid();
            renderAppts();
            renderClients();
            renderWaitlist();
            renderBudget();
            
            const cSel = document.getElementById('appt-client');
            const sSel = document.getElementById('appt-service');
            cSel.innerHTML = store.clients.map(c => `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`).join('');
            sSel.innerHTML = store.services.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        }

        // Шкала времени
        function renderTimeGrid() {
            const cont = document.getElementById('time-grid-content');
            cont.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];
            const dayAppts = store.appointments.filter(a => a.date === today && a.status !== 'cancelled');

            for (let h = 8; h <= 21; h++) {
                cont.innerHTML += `<div class="time-row"><span class="time-label">${h}:00</span></div>`;
            }

            dayAppts.forEach(a => {
                const [h, m] = a.time.split(':').map(Number);
                const top = (h - 8) * 64 + (m / 60) * 64;
                cont.innerHTML += `<div class="appt-slot" style="top: ${top}px; height: 50px;" onclick="openEditAppt('${a.id}')">
                    <p class="text-[11px] font-black text-purple-700">${a.time} • ${a.client_name}</p>
                    <p class="text-[9px] font-bold text-purple-400 uppercase">${a.service}</p>
                </div>`;
            });
            cont.style.height = (14 * 64) + 'px';
        }

        function renderAppts() {
            const today = new Date().toISOString().split('T')[0];
            const list = store.appointments.filter(a => a.date === today);
            const rev = list.filter(a => a.status !== 'cancelled').reduce((s, a) => s + Number(a.price), 0);
            document.getElementById('today-profit').innerText = rev.toLocaleString() + ' ₽';

            document.getElementById('home-upcoming').innerHTML = list.map(a => `
                <div onclick="openEditAppt('${a.id}')" class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center card-${a.status}">
                    <div><p class="font-bold text-sm">${a.client_name}</p><p class="text-[10px] text-purple-600 font-bold">${a.time} - ${a.service}</p></div>
                    <p class="font-black text-sm">${a.price} ₽</p>
                </div>
            `).join('') || '<p class="text-center text-gray-300 py-4 font-bold text-xs">ПУСТО</p>';
        }

        function renderClients() {
            const term = document.getElementById('client-search').value.toLowerCase();
            const filtered = store.clients.filter(c => c.name.toLowerCase().includes(term) || c.phone.includes(term));
            document.getElementById('clients-list').innerHTML = filtered.map(c => `
                <div onclick="showDetails('${c.id}')" class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-2">
                            <p class="font-black text-sm">${c.name}</p>
                            <span class="vip-badge">${c.status_label}</span>
                        </div>
                        <p class="text-[10px] text-gray-400 font-bold">${c.phone}</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-200"></i>
                </div>
            `).join('');
        }

        // --- КАРТОЧКА КЛИЕНТА (ИСПРАВЛЕНО) ---
        function showDetails(id) {
            const c = store.clients.find(item => String(item.id) === String(id));
            if (!c) return;

            document.getElementById('det-name').innerText = c.name;
            document.getElementById('det-phone').innerText = c.phone;
            document.getElementById('det-notes-view').innerText = c.notes || 'Заметок нет';
            document.getElementById('det-total').innerText = c.ltv.toLocaleString() + ' ₽';
            
            document.getElementById('det-call').onclick = () => tg.openLink(`tel:${c.phone}`);

            const history = store.appointments.filter(a => String(a.client_id) === String(id));
            document.getElementById('det-history').innerHTML = history.sort((a,b) => b.date.localeCompare(a.date)).map(a => `
                <div class="bg-gray-50 p-4 rounded-2xl flex justify-between items-center">
                    <div><p class="text-[10px] font-black text-gray-400 uppercase">${fmtDate(a.date)}</p><p class="text-xs font-bold">${a.service}</p></div>
                    <div class="flex items-center gap-3">
                        <a href="tel:${c.phone}" class="text-gray-300"><i class="fas fa-phone-alt"></i></a>
                        <p class="font-black text-xs">${a.price} ₽</p>
                    </div>
                </div>
            `).join('');
            
            editId = id;
            document.getElementById('modal-details').classList.remove('hidden');
        }

        // --- БЮДЖЕТ ---
        function renderBudget() {
            const currentMonth = new Date().getMonth();
            const monthAppts = store.appointments.filter(a => new Date(a.date).getMonth() === currentMonth && a.status !== 'cancelled');
            const rev = monthAppts.reduce((s, a) => s + Number(a.price), 0);
            const exp = store.expenses.filter(e => new Date(e.date).getMonth() === currentMonth).reduce((s, e) => s + Number(e.amount), 0);
            
            document.getElementById('stat-net-profit').innerText = (rev - exp).toLocaleString() + ' ₽';
            document.getElementById('expenses-list').innerHTML = store.expenses.map(e => `
                <div class="bg-white p-3 rounded-xl flex justify-between text-xs font-bold">
                    <span class="text-gray-400">${fmtDate(e.date)}</span>
                    <span>${e.category}</span>
                    <span class="text-red-500">-${e.amount} ₽</span>
                </div>
            `).join('');
        }

        // --- ОЧЕРЕДЬ ---
        function renderWaitlist() {
            document.getElementById('waitlist-list').innerHTML = store.waitlist.map(w => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-purple-500">
                    <p class="font-black text-sm">${w.name}</p>
                    <p class="text-xs text-purple-600 font-bold mt-1">${w.preferred_date || 'Любая дата'}</p>
                </div>
            `).join('');
        }

        // --- УПРАВЛЕНИЕ ОКНАМИ ---
        function handleFabClick() {
            editId = null;
            if (currentTab === 'page-appointments') { document.getElementById('form-appt').reset(); document.getElementById('appt-actions').classList.add('hidden'); openModal('modal-appt'); }
            else if (currentTab === 'page-clients') { document.getElementById('form-client').reset(); openModal('modal-client'); }
            else if (currentTab === 'page-waitlist') { openModal('modal-waitlist'); }
            else if (currentTab === 'page-budget') { openModal('modal-expense'); }
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            tg.MainButton.setText("СОХРАНИТЬ").show().offClick().onClick(() => {
                if (id === 'modal-appt') saveAppt();
                if (id === 'modal-client') saveClient();
                if (id === 'modal-expense') saveExpense();
                if (id === 'modal-waitlist') saveWaitlist();
            });
        }

        async function saveAppt() {
            const cSel = document.getElementById('appt-client');
            const data = {
                id: editId,
                status: document.getElementById('appt-status').value,
                client_id: cSel.value,
                client_name: cSel.options[cSel.selectedIndex].dataset.name,
                service: document.getElementById('appt-service').value,
                price: document.getElementById('appt-price').value,
                date: document.getElementById('appt-date').value,
                time: document.getElementById('appt-time').value
            };
            await send('Appointment', data);
        }

        async function saveClient() {
            const data = {
                id: editId,
                name: document.getElementById('c-name').value,
                phone: document.getElementById('c-phone').value,
                notes: document.getElementById('c-notes').value
            };
            await send('Client', data);
            if (isQuickClient) { isQuickClient = false; closeModal('modal-client'); openModal('modal-appt'); }
        }

        async function saveExpense() {
            const data = { date: document.getElementById('e-date').value, category: document.getElementById('e-category').value, amount: document.getElementById('e-amount').value };
            await send('Expense', data);
        }

        async function saveWaitlist() {
            const data = { name: document.getElementById('w-name').value, phone: document.getElementById('w-phone').value, preferred_date: document.getElementById('w-date').value };
            await send('Waitlist', data);
        }

        async function send(type, data) {
            tg.MainButton.showProgress();
            const action = data.id ? `update${type}` : `add${type}`;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...data }) });
            await loadData();
            closeModal(`modal-${type.toLowerCase()}`);
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); tg.MainButton.hide(); editId = null; }
        function closeDetails() { document.getElementById('modal-details').classList.add('hidden'); }
        
        function openQuickClient() { isQuickClient = true; document.getElementById('modal-appt').classList.add('hidden'); openModal('modal-client'); }
        
        function openEditAppt(id) {
            const a = store.appointments.find(i => String(i.id) === String(id));
            editId = id;
            document.getElementById('appt-status').value = a.status;
            document.getElementById('appt-client').value = a.client_id;
            document.getElementById('appt-service').value = a.service;
            document.getElementById('appt-price').value = a.price;
            document.getElementById('appt-date').value = a.date;
            document.getElementById('appt-time').value = a.time;
            document.getElementById('appt-actions').classList.remove('hidden');
            openModal('modal-appt');
        }

        function editClient() {
            const c = store.clients.find(i => String(i.id) === String(editId));
            document.getElementById('c-name').value = c.name;
            document.getElementById('c-phone').value = c.phone;
            document.getElementById('c-notes').value = c.notes;
            document.getElementById('modal-details').classList.add('hidden');
            openModal('modal-client');
        }

        function switchTab(id) {
            currentTab = id;
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
            document.querySelector(`[data-target="${id}"]`).classList.add('nav-active');
            tg.HapticFeedback.impactOccurred('light');
        }

        function copyReminderText() {
            const a = store.appointments.find(i => String(i.id) === String(editId));
            const text = `Привет! Напоминаю о записи: ${fmtDate(a.date)} в ${a.time}. Жду тебя!`;
            navigator.clipboard.writeText(text);
            tg.showAlert('Текст скопирован!');
        }

        async function deleteAppt() {
            if(confirm('Удалить?')) {
                tg.MainButton.showProgress();
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteAppointment', id: editId }) });
                await loadData();
                closeModal('modal-appt');
            }
        }
    </script>
</body>
</html>
